<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Подтверждение почты — UA—DE Navigator</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body data-auth-callback="true">
  <main class="app-shell" style="padding:clamp(20px,5vw,64px)">
    <h1>Подтверждение почты</h1>
    <p id="authCallbackStatus" role="status">Проверяем ссылку…</p>
    <form id="passwordResetForm" class="lead-form" style="max-width:520px" hidden>
      <label for="newPassword">Новый пароль (минимум 12 символов)</label>
      <input id="newPassword" name="password" type="password" autocomplete="new-password" minlength="12" required />
      <label for="confirmNewPassword">Повторите пароль</label>
      <input id="confirmNewPassword" name="confirm_password" type="password" autocomplete="new-password" minlength="12" required />
      <button type="submit">Сохранить новый пароль</button>
    </form>
    <a href="./index.html">На главную</a>
  </main>
  <script src="./cloud-config.js"></script>
  <script src="./cloud-client.js"></script>
</body>
</html>
